[bar]
order = ["main"]

[bar.default]
position = "top"
enabled = true
layer = "top"
reserve_space = true

thickness = 30
background_opacity = 0.8
radius = 0
margin_edge = 0
margin_ends = 0

start = ["control-center", "gap", "workspaces"]
center = ["clock"]
end = ["tray", "notifications"]

[widget.gap]
type = "spacer"
length = 8

[widget.clock]
format = "{:%A, %B %e - %H:%M}"

[widget.control-center]
custom_image = "~/.config/noctalia/glyphs/arch-linux.png"
custom_image_colorize = true

[widget.tray]
capsule = true
capsule_fill = "on_secondary"

[widget.workspaces]
style = "regular"

[idle.behavior.lock]
timeout = 600
action = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 660
action = "screen_off"
enabled = true

[idle.behavior.suspend]
timeout = 900
action = "lock_and_suspend"
enabled = true

[lockscreen]
enabled = true
lock_before_suspend = true
fingerprint = true
allow_empty_password = false
blurred_desktop = true
blur_intensity = 0.8
tint_intensity = 0.3

[shell]
clipboard_image_action_command = "satty -f -"
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true
ui_scale = 1.20

[shell.greeter_sync]
auto_sync = false
privilege_command = "ghostty -e pkexec"

[shell.panel]
open_near_click_control_center = true
session_placement = "floating"
session_position = "center"

[shell.screenshot]
copy_to_clipboard = false
pipe_command = "satty -f -"
pipe_to_command = true
save_to_file = false

[[shell.session.actions]]
action = "lock"
countdown_seconds = 0.0
enabled = true
shortcut = "1"
variant = "default"

[[shell.session.actions]]
action = "logout"
countdown_seconds = 0.0
enabled = true
shortcut = "2"
variant = "default"

[[shell.session.actions]]
action = "lock_and_suspend"
countdown_seconds = 2.0
enabled = true
shortcut = "3"
variant = "default"

[[shell.session.actions]]
action = "reboot"
countdown_seconds = 2.0
enabled = true
shortcut = "4"
variant = "default"

[[shell.session.actions]]
action = "shutdown"
countdown_seconds = 2.0
enabled = true
shortcut = "5"
variant = "destructive"

[theme.templates]
enable_builtin_templates = true
enable_community_templates = true

builtin_ids = ["gtk3", "gtk4", "kcolorscheme", "qt", "hyprland"]

community_ids = [
  "heroiclauncher",
  "obs",
  "discord",
  "hyprtoolkit",
  "obsidian",
  "steam",
]
